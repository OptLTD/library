name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver tag, e.g. v0.1.0
        required: true
        type: string
      modules:
        description: Comma-separated modules (empty = all)
        required: false
        default: search,engine/memory,engine/mysql,engine/mongo,engine/postgres,engine/sqlite,engine/elastic,engine/redis,formula,jsrunner,jsmodule
        type: string
      skip_tests:
        description: Skip go test
        required: false
        default: false
        type: boolean
  push:
    tags:
      - release/v*  # ← 只保留这一个

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MODULE_PREFIX: github.com/OptLTD/library

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            search/go.sum
            engine/memory/go.sum
            engine/mysql/go.sum
            engine/mongo/go.sum
            engine/postgres/go.sum
            engine/sqlite/go.sum
            engine/elastic/go.sum
            engine/redis/go.sum
            formula/go.sum
            jsrunner/go.sum
            jsmodule/go.sum

      - name: Sync workspace
        run: go work sync

      - name: Test modules
        run: |
          set -euo pipefail
          for mod in search engine/memory engine/mysql engine/mongo engine/postgres engine/sqlite engine/elastic engine/redis formula jsrunner jsmodule; do
            echo "testing $mod"
            (cd "$mod" && go test ./...)
          done

  release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            search/go.sum
            engine/memory/go.sum
            engine/mysql/go.sum
            engine/mongo/go.sum
            engine/postgres/go.sum
            engine/sqlite/go.sum
            engine/elastic/go.sum
            engine/redis/go.sum
            formula/go.sum
            jsrunner/go.sum
            jsmodule/go.sum

      - name: Resolve release version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#release/}"
          else
            version="${{ inputs.version }}"
          fi
          version="$(printf '%s' "$version" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sync workspace
        run: go work sync

      - name: Validate modules
        id: validate
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MODULES: ${{ github.event_name == 'workflow_dispatch' && inputs.modules || 'search,engine/memory,engine/mysql,engine/mongo,engine/postgres,engine/sqlite,engine/elastic,engine/redis,formula,jsrunner,jsmodule' }}
        run: |
          set -euo pipefail

          mods=()
          IFS=',' read -ra parts <<< "$MODULES"
          for mod in "${parts[@]}"; do
            mod="$(printf '%s' "$mod" | xargs)"
            [[ -z "$mod" ]] && continue
            [[ -f "$mod/go.mod" ]] || { echo "unknown module: $mod" >&2; exit 1; }
            mods+=("$mod")
          done
          [[ ${#mods[@]} -gt 0 ]] || { echo "no modules selected" >&2; exit 1; }

          for mod in "${mods[@]}"; do
            expected="${MODULE_PREFIX}/${mod}"
            if ! grep -qE "^module ${expected}$" "$mod/go.mod"; then
              echo "$mod/go.mod: expected module path $expected" >&2
              exit 1
            fi
          done

          todo=()
          existing=0
          for mod in "${mods[@]}"; do
            tag="${mod}/${VERSION}"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "already released: $tag"
              existing=$((existing + 1))
            else
              echo "will release $tag"
              todo+=("$mod")
            fi
          done

          if [[ ${#todo[@]} -eq 0 ]]; then
            echo "All selected modules already tagged at ${VERSION}; nothing to do."
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${mods[@]}" > /tmp/release-modules.txt
            exit 0
          fi

          if [[ "$existing" -gt 0 ]]; then
            echo "partial release detected for ${VERSION}: ${existing} tag(s) exist, ${#todo[@]} missing" >&2
            echo "Refuse to continue. Delete stray tags or release the remaining modules explicitly." >&2
            exit 1
          fi

          echo "already_released=false" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${todo[@]}" > /tmp/release-modules.txt

      - name: Prepare publishable go.mod
        if: steps.validate.outputs.already_released != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          (cd jsrunner && \
            go mod edit -dropreplace=github.com/OptLTD/library/jsmodule && \
            go mod edit -require=github.com/OptLTD/library/jsmodule@"v${ver}")
          (cd jsmodule && \
            go mod edit -dropreplace=github.com/OptLTD/library/jsrunner && \
            go mod edit -require=github.com/OptLTD/library/jsrunner@"v${ver}")
          for driver in engine/memory engine/mysql engine/mongo engine/postgres engine/sqlite engine/elastic engine/redis; do
            (cd "$driver" && \
              go mod edit -dropreplace=github.com/OptLTD/library/search && \
              go mod edit -require=github.com/OptLTD/library/search@"v${ver}")
          done
          go work sync

          while IFS= read -r mod; do
            [[ -z "$mod" ]] && continue
            if grep -qE '^replace ' "$mod/go.mod"; then
              echo "$mod/go.mod: replace directives must be removed before publishing" >&2
              exit 1
            fi
          done < /tmp/release-modules.txt

      - name: Configure git
        if: steps.validate.outputs.already_released != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tags
        if: steps.validate.outputs.already_released != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git add jsrunner/go.mod jsmodule/go.sum jsrunner/go.sum jsmodule/go.mod \
            engine/memory/go.mod engine/mysql/go.mod engine/mongo/go.mod \
            engine/postgres/go.mod engine/sqlite/go.mod \
            engine/elastic/go.mod engine/redis/go.mod 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): prepare go.mod for ${VERSION}"
          fi
          while IFS= read -r mod; do
            [[ -z "$mod" ]] && continue
            tag="${mod}/${VERSION}"
            git tag -a "$tag" -m "Release ${MODULE_PREFIX}/${mod} ${VERSION}"
            git push origin "$tag"
          done < /tmp/release-modules.txt

      - name: Summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "## Release ${VERSION}"
            echo
            if [[ "${{ steps.validate.outputs.already_released }}" == "true" ]]; then
              echo "Already released — module tags already exist. No new tags created."
              echo
            fi
            echo "Go modules are available via:"
            echo
            echo '```bash'
            while IFS= read -r mod; do
              [[ -z "$mod" ]] && continue
              echo "go get ${MODULE_PREFIX}/${mod}@${VERSION}"
            done < /tmp/release-modules.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
